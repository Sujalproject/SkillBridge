<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SkillBridge evaluation dashboard</title>
  <desc id="desc">Latest committed evaluation across 35 synthetic cases. Normalization macro F1 99.68 percent. Semantic matching macro precision 98.18 percent, recall 95.44 percent, F1 96.64 percent. Micro precision 97.39 percent, recall 93.85 percent, F1 95.59 percent, with 336 true positives, 9 false positives and 22 false negatives. No targeted non-equivalent false-positive checks or scoring anomalies were detected.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b2d"/><stop offset="1" stop-color="#172b43"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd1c5"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#f8fafc}.sub{font:16px Arial,sans-serif;fill:#a9bbcf}
      .label{font:600 17px Arial,sans-serif;fill:#dce7f3}.value{font:700 27px Arial,sans-serif;fill:#f8fafc}
      .small{font:14px Arial,sans-serif;fill:#a9bbcf}.card{fill:#1d334d;stroke:#35506d;stroke-width:1}
      .track{fill:#30465f}.bar{fill:url(#accent)}.good{font:700 20px Arial,sans-serif;fill:#7ee3c2}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="58" y="66" class="title">SkillBridge · Evaluation Snapshot</text>
  <text x="58" y="98" class="sub">Custom evaluation framework · 35 synthetic test cases · latest committed report</text>
  <rect x="58" y="126" width="1084" height="1" fill="#35506d"/>
  <rect x="58" y="151" width="330" height="108" rx="15" class="card"/>
  <text x="82" y="187" class="small">TOTAL TEST CASES</text><text x="82" y="231" class="value">35</text>
  <rect x="435" y="151" width="330" height="108" rx="15" class="card"/>
  <text x="459" y="187" class="small">TARGETED NON-EQUIVALENT FP</text><text x="459" y="231" class="good">0 detected</text>
  <rect x="812" y="151" width="330" height="108" rx="15" class="card"/>
  <text x="836" y="187" class="small">SCORING ANOMALIES</text><text x="836" y="231" class="good">0 detected</text>

  <text x="58" y="310" class="label">Skill normalization · macro F1</text>
  <text x="1142" y="310" text-anchor="end" class="value">99.68%</text>
  <rect x="58" y="326" width="1084" height="15" rx="7.5" class="track"/><rect x="58" y="326" width="1080.5" height="15" rx="7.5" class="bar"/>

  <text x="58" y="386" class="label">Semantic skill matching · macro averages</text>
  <text x="58" y="423" class="small">Precision</text><text x="1142" y="423" text-anchor="end" class="label">98.18%</text>
  <rect x="58" y="435" width="1084" height="11" rx="5.5" class="track"/><rect x="58" y="435" width="1064.3" height="11" rx="5.5" class="bar"/>
  <text x="58" y="478" class="small">Recall</text><text x="1142" y="478" text-anchor="end" class="label">95.44%</text>
  <rect x="58" y="490" width="1084" height="11" rx="5.5" class="track"/><rect x="58" y="490" width="1034.6" height="11" rx="5.5" class="bar"/>
  <text x="58" y="533" class="small">F1 score</text><text x="1142" y="533" text-anchor="end" class="label">96.64%</text>
  <rect x="58" y="545" width="1084" height="11" rx="5.5" class="track"/><rect x="58" y="545" width="1047.6" height="11" rx="5.5" class="bar"/>

  <rect x="58" y="586" width="1084" height="105" rx="15" class="card"/>
  <text x="82" y="619" class="label">Micro matching metrics</text>
  <text x="82" y="655" class="small">Precision 97.39%  ·  Recall 93.85%  ·  F1 95.59%</text>
  <text x="82" y="679" class="small">336 true positives  ·  9 false positives  ·  22 false negatives</text>
  <rect x="58" y="710" width="1084" height="1" fill="#35506d"/>
  <text x="58" y="738" class="small">Scoring-property audit passed · 0 scoring anomalies</text>
</svg>