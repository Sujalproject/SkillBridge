<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">SkillBridge evaluation dashboard</title>
  <desc id="desc">Evaluation snapshot across 35 synthetic cases. Normalization F1 99.27 percent, matching precision 93.47 percent, recall 80.62 percent, F1 84.99 percent, zero false positives and zero scoring anomalies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b2d"/><stop offset="1" stop-color="#172b43"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd1c5"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#f8fafc}.sub{font:16px Arial,sans-serif;fill:#a9bbcf}
      .label{font:600 17px Arial,sans-serif;fill:#dce7f3}.value{font:700 27px Arial,sans-serif;fill:#f8fafc}
      .small{font:14px Arial,sans-serif;fill:#a9bbcf}.card{fill:#1d334d;stroke:#35506d;stroke-width:1}
      .track{fill:#30465f}.bar{fill:url(#accent)}.good{font:700 22px Arial,sans-serif;fill:#7ee3c2}
    </style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="url(#bg)"/>
  <text x="58" y="66" class="title">SkillBridge · Evaluation Snapshot</text>
  <text x="58" y="98" class="sub">Custom evaluation framework · 35 synthetic test cases</text>
  <rect x="58" y="126" width="1084" height="1" fill="#35506d"/>
  <rect x="58" y="151" width="330" height="112" rx="15" class="card"/>
  <text x="82" y="188" class="small">TOTAL TEST CASES</text><text x="82" y="232" class="value">35</text>
  <rect x="435" y="151" width="330" height="112" rx="15" class="card"/>
  <text x="459" y="188" class="small">FALSE POSITIVES</text><text x="459" y="232" class="good">0 detected</text>
  <rect x="812" y="151" width="330" height="112" rx="15" class="card"/>
  <text x="836" y="188" class="small">SCORING ANOMALIES</text><text x="836" y="232" class="good">0 detected</text>
  <text x="58" y="315" class="label">Skill normalization</text>
  <text x="1142" y="315" text-anchor="end" class="value">99.27% F1</text>
  <rect x="58" y="332" width="1084" height="17" rx="8.5" class="track"/><rect x="58" y="332" width="1076" height="17" rx="8.5" class="bar"/>
  <text x="58" y="399" class="label">Semantic skill matching</text>
  <text x="58" y="438" class="small">Precision</text><text x="1142" y="438" text-anchor="end" class="label">93.47%</text>
  <rect x="58" y="450" width="1084" height="13" rx="6.5" class="track"/><rect x="58" y="450" width="1013" height="13" rx="6.5" class="bar"/>
  <text x="58" y="496" class="small">Recall</text><text x="1142" y="496" text-anchor="end" class="label">80.62%</text>
  <rect x="58" y="508" width="1084" height="13" rx="6.5" class="track"/><rect x="58" y="508" width="874" height="13" rx="6.5" class="bar"/>
  <text x="58" y="554" class="small">F1 score</text><text x="1142" y="554" text-anchor="end" class="label">84.99%</text>
  <rect x="58" y="566" width="1084" height="13" rx="6.5" class="track"/><rect x="58" y="566" width="922" height="13" rx="6.5" class="bar"/>
  <rect x="58" y="615" width="1084" height="45" rx="10" fill="#173d42"/>
  <text x="82" y="644" class="label">Scoring integrity checks</text><text x="1115" y="644" text-anchor="end" class="good">PASSED</text>
</svg>